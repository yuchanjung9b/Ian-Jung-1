<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cities of Korea · Korea Travel Guide · 한국 여행 가이드</title>
    <meta name="description" content="Every city in South Korea, listed by province, with the special cities shown separately." />
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <nav class="nav">
      <div class="wrap">
        <a class="brand" href="index.html">Korea Travel Guide <span>한국 여행 가이드</span></a>
        <span class="nav-links"><a href="guide.html">Provinces</a> <a href="cities.html">Cities</a> <a href="plan.html">Trip planner</a></span>
      </div>
    </nav>

    <header class="hero hero-small">
      <div class="wrap hero-inner">
        <p class="eyebrow">도시</p>
        <h1>Cities of Korea</h1>
        <p class="lead">Every city in South Korea, by province. Special cities are listed on their own.</p>
      </div>
    </header>

    <main class="wrap">
      <p class="count-line" id="count-line"></p>
      <label class="city-search">Find a city
        <input type="search" id="city-search" placeholder="Type a name in English or Korean" autocomplete="off" />
      </label>
      <div id="city-list"></div>
      <p id="no-match" class="empty" hidden>No city matches that search.</p>
    </main>

    <footer class="footer">
      <div class="wrap"><a href="index.html">Home</a> · Korea Travel Guide · 한국 여행 가이드</div>
    </footer>

    <script src="cities.js?v=3"></script>
    <script>
      const esc = (t) => { const d = document.createElement("div"); d.textContent = t ?? ""; return d.innerHTML; };
      const list = document.getElementById("city-list");
      const total = PROVINCE_CITIES.reduce((n, p) => n + p.cities.length, 0);
      document.getElementById("count-line").innerHTML =
        `<strong>${SPECIAL_CITIES.length}</strong> special cities and <strong>${total}</strong> cities across <strong>${PROVINCE_CITIES.length}</strong> provinces.`;

      const chip = (en, ko, extra = "") =>
        `<li class="city" data-q="${esc((en + " " + ko).toLowerCase())}"><b>${esc(en)}</b> <span>${esc(ko)}</span>${extra}</li>`;

      function render() {
        list.innerHTML =
          `<section class="city-group special" data-group>
            <h2 class="section-title">Special cities <span class="ko-inline">특별시 · 광역시 · 특별자치시</span> <small>${SPECIAL_CITIES.length}</small></h2>
            <ul class="city-grid">${SPECIAL_CITIES.map((c) => chip(c.name, c.ko, `<em>${esc(c.type)}</em>`)).join("")}</ul>
          </section>` +
          PROVINCE_CITIES.map(
            (p) => `
          <section class="city-group" data-group>
            <h2 class="section-title">${p.guide ? `<a href="guide.html#${p.guide}">${esc(p.name)}</a>` : esc(p.name)}
              <span class="ko-inline">${esc(p.ko)}</span> <small>${p.cities.length}</small></h2>
            <ul class="city-grid">${p.cities.map(([en, ko]) => chip(en, ko)).join("")}</ul>
          </section>`
          ).join("");
      }

      document.getElementById("city-search").addEventListener("input", (e) => {
        const q = e.target.value.trim().toLowerCase();
        let shown = 0;
        list.querySelectorAll("[data-group]").forEach((g) => {
          let any = false;
          g.querySelectorAll(".city").forEach((li) => {
            const match = !q || li.dataset.q.includes(q);
            li.hidden = !match;
            any = any || match;
            if (match) shown++;
          });
          g.hidden = !any;
        });
        document.getElementById("no-match").hidden = shown > 0;
      });
      render();
    </script>
  </body>
</html>
